<script>
$(function () {

    $('#contactForm').submit(function (e) {
        e.preventDefault();

        const form = $(this);
        const result = form.find('.form-results');

        $.ajax({
            url: form.attr('action'),
            type: 'POST',
            data: form.serialize(),
            dataType: 'json',

            beforeSend() {
                result.removeClass('d-none alert-success alert-danger')
                      .addClass('alert alert-info')
                      .text('Sending...');
            },

            success(res) {
                result.removeClass('alert-info')
                      .addClass(res.alert)
                      .text(res.message);

                if (res.alert === 'alert-success') form[0].reset();
            },

            error() {
                result.removeClass('alert-info')
                      .addClass('alert alert-danger')
                      .text('Something went wrong. Please try again.');
            }
        });
    });

});
</script>
