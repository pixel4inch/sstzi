      <script>
gsap.registerPlugin(ScrollTrigger);

fetch("data/service.json")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("services-container");

    container.innerHTML = data.Services.map((service, i) => `
      <section class="pb-0 service-section ">
        <div class="container">
          <div class="row align-items-center justify-content-center mb-7 sm-mb-40px">

            ${i % 2 === 0 ? textBlock(service) : imageBlock(service)}
            ${i % 2 === 0 ? imageBlock(service) : textBlock(service)}

          </div>
        </div>
      </section>
    `).join("");

    // 🔥 Animate AFTER DOM is ready
    initServiceAnimations();
  });


function textBlock(s) {
  return `
  <div class="col-xl-6 col-lg-6 col-md-10 md-mb-50px service-text">
    <h4 class="fw-600 text-base-color ls-1px fs-25 alt-font service-title">
      ${s.Title}
    </h4>
    <span class="text-dark-gray service-desc">
      ${s.Description}
    </span>
  </div>`;
}


function imageBlock(s) {
  return `
  <div class="col-lg-6 position-relative z-index-1 service-image  ">
    <div class="atropos" data-atropos data-atropos-perspective="2450">
      <div class="atropos-scale">
        <div class="atropos-rotate">
          <div class="atropos-inner">
            <img src="./img/SS/${s.image}" 
                 alt="${s.Title}" 
                 class="border-radius-6px shadow-lg"/>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
</script>

<script>
function initServiceAnimations() {

  gsap.utils.toArray(".service-section").forEach(section => {

    const title = section.querySelector(".service-title");
    const desc  = section.querySelector(".service-desc");
    const image = section.querySelector(".service-image");

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: section,
        start: "top 80%",
        toggleActions: "play none none none"
      }
    });

    // 1️⃣ Title first
    tl.from(title, {
      y: 30,
      opacity: 0,
      duration: 0.8,
      ease: "power2.out"
    });

    // 2️⃣ Description next
    tl.from(desc, {
      y: 30,
      opacity: 0,
      duration: 0.8,
      ease: "power2.out"
    }, "-=0.3"); // overlap slightly

    // 3️⃣ Image (optional, synced nicely)
    if (image) {
      tl.from(image, {
        y: 40,
        opacity: 0,
        duration: 0.8,
        ease: "power2.out"
      }, "-=0.4");
    }

  });
}
</script>
